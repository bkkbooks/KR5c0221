front:
  text: 嵩山太元先生氣經卷下
  hash: sha256:771ea30dbdad41272fb8f8b6d96a12cf5356cc6d284549cbf0767d4d8e0f06fd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0221_HFL_002-001a, image: hfl/0569/0569-118.png}
body:
  text: 修存訣凡胎息氣者其道皆先叩齒三十六通集諸神然後轉頸一匝其胎息巳咽喉咽之如此三通方以舌內外磨料取玉津液滿口漱溜昂頭咽之上補泥丸下潤五臟至夜半及五更展腳握固展兩手去身五寸其枕髙三寸閉目依前法咽之梳洗了暖取一杯酒飲之胎息滋六府酒引氣潤百關聖人言人在氣中氣在人中人不離氣氣不離人人藉氣而生氣散人死人死生之理盡在氣中但調鍊元氣求死不得王老云久而行之求死不得此之謂也老君云甘雨潤萬物胎津潤百體黃庭經云晝夜不寐乃成真上致神仙下益其壽在身所有疾病想氣攻之其疾立愈其真氣逐濁氣下泄即覺神情爽利器宇冲和老君曰靈谷玉英並在巳身名山大澤採藥服食可以滋助正氣若全使之即與道有乖若久服胎息不亂者自然氣圓成真妙不假羽翼而乃升騰也夫胎藏嬰兒握固服元氣握固是天地之間握者猶心閉門邪氣不入也夫嬰兒所以握固在母腹中飲其元氣故號曰胎息合本元氣不動不搖自然不飢不渴也學胎元者若閉氣極悶即微吐其濁氣呵而出之旋便却閉常守其元自然成妙矣夫人身禀元氣所生還須以胎元補之故曰保其元氣是曰自然還丹步虛曰冲虛太和氣吐納流霞津胎息靜百關寥寥究三便泥丸洞明鏡遂成金華仙又曰常念餐元精鍊液固形質學道之人常含元氣挹漱流霞充灌關府津潤骨節回凋朽之頺齡復童嬰之怡顔吐納改容若非鍊液如此凡胎息上衝咽喉用何物為應以雷鳴應候為胎息矣握固亦常行夫咽喉下有十二樓胎息氣上通頭咽之名曰補腦之法祕之故曰飢食太和自然之氣即胎息也渴飲華池漿口中津液也得津液還歸溉灌神門腎宮滋潤玉液甘甜深宜保之夫五臟上應列宿下應五行常須以清淨保之矣愼氣法慎氣法曰夫氣之為理也納而難固吐而易竭難固須保全易竭須潜而勿泄真人曰學道如憶朝餐未有不得之者惜氣如惜面目未有不全者又曰若使惜氣如一身之先急者吾少見枯悴也其於接對言笑須冝省灼運動呼呌特宜調緩觸類愛慎方免損矣夫人與天地合體隂陽混氣皮膚骨髓腑臟榮衛呼吸進退寒暑變異之事莫不同乎二儀五行也是知天地否泰隂陽之氣亂焉臟腑不調經脉之候病矣因外寒暑之病起於風因所致者百病起於氣故曰恬淡虛無真氣從之精神內守病從何來是故須知形神以性和而全之審內外之病而慎之夫人有三丹田以合三元上中下也上丹田泥丸腦宫也其神赤子字元先一名帝卿其神赤衣冠治上元也中丹田絳宮心也其真人字子丹一名中光堅其神赤衣冠治中元也下丹田臍下氣海精門也其神嬰兒字元陽一名谷下玄赤衣冠浩下元也此三丹田以應三元中各有一神若虧損即氣漏精泄精泄即氣散也夫精者身之根根者氣之位精全即氣全精泄即氣泄唯精與氣須全耳又云精能食氣形能食味夫咽氣不得和津液咽之津液須别咽若和津液恐招生風入腹成疾咽津液時須候出息咽之尤妙也嵩山太無先生氣經卷下終
