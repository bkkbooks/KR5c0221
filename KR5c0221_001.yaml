body:
  text: 嵩山太無先生氣經卷上并序下同卷盡七夫形之所恃者氣也氣之所依者形也氣全即形全氣竭即形斃是以攝生之士莫不鍊形養氣以保其生未有有形而無氣者即氣之輿形相須而成豈不皎然余慕至道備尋祕訣自行氣守真向三十餘載所聞所見殊未愜心大曆中遇羅浮山王公自北嶽而返倚策高昂依然相顧余奇異人延之與語果然方外有道之君子也哀余懇至見授吐納須一二理身之要逍其恩罔極非言詞所能盡每云道之要法不在經書悉傳口訣其二景五牙六戊諸服氣法皆為外氣外氣剛徑非從中之事所能冝服也至如內氣己正是曰胎息身中自有非假外求不得明師之口訣徒為勞苦終無所成今所撰録皆承師之旨要以申明之諒非愚蒙所自裁王公嘗謂余曰老君云我命在我不在天地又曰吾與天地分一氣而自理焉天地焉能死吾哉斯實真言要訣也修奉之士冝三復之恭承誘訓敢不佩服有偶時得此訣者須愼勿輕傳示無或泄露以致其殃耳服氣訣修真服氣訣每日常卧攝心絶想閉氣握固鼻引口吐無令耳聞唯是細微滿即閉閉使足心汗出一至二數至百巳上閉極微吐之引少氣還閉熱即呵之冷即吹之能至千數即不須糧食亦不須藥時飲一盞酒作水通暢耳數至五千則隨處出入有功當自知也則有入水卧功矣夫眼食生貴有恆真氣既降方有通感豈有縱心嗜欲而望靈仙羽化必無此事也但仙人至士行功未滿尚不能致況凡俗乎但信老人言勤行之即當自知矣進取訣進取訣曰凡欲服氣先須得一髙燥靜密之室不在大務絶風隙而巳室中左右常燒香不用乳頭者床須厚軟腳須稍髙真誥曰床髙免鬼吹蓋言鬼物者善因地氣以吹人而為藥忤床髙三尺可矣衣被寒暖使枕髙三寸二分裏內一寸九分飪令與背平每夜半後生氣時或五更睡之初覺先呵出腹中濁惡氣一九下止若要而言之亦不在夜半之與五更但天氣調和腹中空則為之閉目叩齒三十六通以警身中神畢以兩手煴目大小眥兼按之左右抵耳摩面為真人起居之法隨事導引先以宣暢關節乃以舌拄上腭料口中內外津液滿口則咽之令下入胃神承之以此三者三止是謂漱咽靈液灌溉五臟面乃光矣此之法熟大體同略便兀然放神使心同太空身若委蛻情纍都遣然後服之每事皆閉目握固唯散氣時即展指也夫握固所以閉關防而却精邪初服氣之人氣水流行則不得握固待至百日或半年覺氣通暢掌中出汗即可握固黃庭經云閉塞三關握固停漱咽靈液吞玉英遂至不飢三蟲亡心意常調致欣昌是也陶氣訣陶氣訣曰凡人五臟亦各有氣夜卧閉息覺後欲服氣則先陶氣轉令宿食消故氣得出然後始得調服其法閉目握固仰卧倚兩拳於乳間竪兩膝舉背及尻固閉氣海中氣使自內向外軿而轉之呵而出之一九二九止是曰陶氣訖還則調之調氣訣調氣訣曰鼻為天門口為地户則鼻納之口吐之不得有忤忤則氣逆逆則生疾吐納之際尤冝愼之亦不欲自耳聞之或七或九令和平也是曰調氣調畢則咽之夜卧閉之不可口吐也常須在意意久則得調也咽氣訣咽氣訣曰服內氣之妙在乎咽氣世人將外氣以為內氣不能分别忤何甚哉吐納之士宜審而為之氣或錯忤耳夫人皆稟天地元氣而生身中分之元氣而自理每吐咽則內氣與外氣相應自氣海中隨吹而直上直至喉中但惟吐極之際則轉閉口速鼓而咽之令郁然有聲汨汨然從左邊而下經二十日即如水瀝坎聞之分眀也女則右邊而下如此則內氣之與外氣自皎然别次以意送之以手摩之令運入氣海中氣海在臍下三寸也亦謂之下丹田初服氣人上膲未通以手摩而助之令速下若氣巳通流不摩亦得一閉口即三連咽號曰雲行一濕咽謂之雨施初服人氣未通流每一咽則施行不可遽至連三也氣通暢然後稍加之直至於小成也一年後始可流通三年功成乃可恣服夫人氣既未通咽或未下須以一咽為候每咽吐極則大鼓口微用少力蹙而咽之務令郁聲汩汨而下直入氣海中如此了然後為三連咽則便成也且此訣要益余身並深咽之非久用心者焉能較量而洞見真理初服氣人及久服未得其妙者有得此訣何其幸歟何其幸歟輕於傳示必招譴罰愼之愼之每為之向東終而復始準前所為候也行氣訣行氣訣曰下丹田後脊二穴通脊脈上達泥丸泥丸腦宫也每三咽連則存下丹田中所納得元氣以意引之令入二穴因想見兩條白氣夾脊雙引直上入泥丸薰蒸諸宫森然遍下毛髮面部頸項兩臂及手指一時而入胸中丹田心也灌注五臟却歷下丹田至三里遍尻經膝腂下達湧泉足心也所謂分一氣而理則鼓之以雷霆潤之以風兩之義亦由天地有泉源非雷霆動則氣不能潤蕩萬物人身有津液非咽漱則無以溉五臟蒙光彩還精補腦非交會則不能通而上之咽服內氣非吐納即不能抽而用之逆知回薄之道運用之理所以則天法地也想身中濁惡結滯邪氣瘀血被正氣蕩除皆從手足指端出謂之散氣即展手指不須握固如此一度則是一通通則氣痞痞則復調使平平則復鼓咽如前也閉氣鼓氣咽至三十六咽為之小成為未絶粒但且至此即得常須少食務令腹中曠然虛淨無問坐卧但腹空即咽之通夕至十度自然三百六十度咽矣謂之大成是謂大胎息如胎息但閉氣數至一千二百息亦謂大成然亦不能鍊形易質縱得長生尤同枯木無精光也又有鍊氣閉氣委氣布氣諸事并雜訣要列於下同志君子詳而行之萬不失一也鍊氣訣鍊氣訣曰服氣餘暇入室脫衣散髮仰卧展手勿握固梳髮令通垂席而布之即調氣咽之訖便閉氣候極乃冥心絶想任氣所之過理絶悶則吐之喘急即調之候氣平又鍊之氣通加至二十三十四十五十即令遍身汗出如有此狀是其效也安心和氣且卧勿起衝風乃却老延年之良術也神清氣爽則為之欲睡勿為也常為之不必每日要獨清爽時為之也十日五日一度為之候黃庭經云千災巳消百病痊不但虎狼之凶殘亦以却老年永延是也委氣訣委氣訣曰委氣之法體氣和平心神調暢無問坐卧則可為之依門户調氣或身於床或兀然而坐似無神識寂寂沈沈使心同太空因而閉十氣或二十氣皆須任氣不得與意相爭良久氣當從百毛孔出不復吐也縱有十分氣一二也復調為能至十或百息巳上彌加候行住坐卧皆為之如此勤行百關開通顔色潤恱氣清而長如沐浴但體有不和使為之亦必當清泰也黃庭經曰髙拱無為魂魄安清淨神見與我言是也閉氣訣閉氣訣曰忽有修養乖冝偶生諸疾宜投密室依法布手足則調氣咽之有所苦之處閉氣以意想經氣以攻之氣極即吐之訖復咽繼之急氣即止氣調復攻或二十三十四十五十攻覺所苦之處汗出通潤即止如未愈即每日夜半或五更晝日頻作意攻之以差為度病在頭面手足但有疾之處則攻之無不愈者知心之使氣於手足有如神即功力難言也布氣訣布氣訣曰夫用氣與人療疾先須依前人五臟所患之疾取方向之氣布入前人身中令病者向方息心靜慮此與布氣令其自愈亦咽氣息念求除也自然邪氣永絶正氣布訖邪風自退也六氣設六氣訣曰六氣者呬呵呼噓吹嘻是也五臟各屬一氣餘在三膲此都包矣呬屬肺主鼻有塞熱不和及勞極依呬吐納兼皮膚瘡病有此疾者則依狀理之立愈呵屬心主舌乾澀氣不通及諸邪氣呵出之大熱大開口小熱小開口大須作意量冝理之違度則損呼屬脾主中宮土如氣微熱不和腹肚脹滿悶不泄以呼理之即愈噓屬肝肝主目如目溫熱可噓以理之即愈吹屬腎腎主耳腰腳冷陽道衰以吹理之即愈嘻屬三膲如不和以嘻理之六氣雖各有所管但五臟三膲冷熱極風邪不調都屬於心呵之以理諸疾皆愈不必用氣也諸家説準此行可立見功效調液訣調液訣曰人食五味五味各歸一臟每臟濁氣同出於口又六腑三膲之氣亦湊此門衆穢總投合成濁氣每睡覺濁穢之氣自不堪聞審而察之知其時候口中乾苦舌澀頰熱少津液或咽唾喉中痛不能食是熱也即須開口呵之必須依門户出入之十呵二十呵即鳴天鼓或七或九以舌漱華池而咽津液復呵察熱退心但候口中清水甘泉生即是熱退五臟涼也若口中津液冷淡不受水即冷狀也即以吹治之法候口中自美心調即止黃庭經云玉池清水灌靈根審能修之可長存又曰漱咽靈液災不干也飮食訣飲食訣曰服氣之後所養有序次其可食之物有損有益有益者冝可食之有損者即可節之益乃長服每日平旦食少許淡水粥甚宜人理脾氣令人足津液日中食淡麵餺飥並佳及蔥薤羮糯米大麥飯鹿肉作白脯巳上並佳食後吞生椒三五枚及先咽氣三五咽消食引下氣通三膲和五臟趂惡氣助正氣特冝長服辟寒凛暑濕明目和中理氣功不可備具在太清經上卷更有別方妙忌食十二屬三十六禽本命父母本屬特忌熱蒸餅亂正氣肥豬肉生萊令人脈閉瓜棗栗芋菱芡獐鴈野雞並可食之不欲其心首脂也齋戒須總絶之天師所種木中之玉名曰南燭草每叢七十二莖每莖二十四枝每枝五葉應七十二候五行二十四氣也江東少室山南嶽湘江化中並有之作飢飯食之佳作煎亦得不必依太清經中所須但單南燭草即得凡食乍可飢不得令飽飽即傷心氣難行也仍忌蘿蔔羮生冷辛辣之物酸滑粘膩陳硬難消之物切忌若偶然食此等物一口則物所在處當微微有痛愼之愼之但食軟物無慮凡服氣後有氣下則泄之愼勿絶絶即成疾每朝空腹隨性飲一盞好清酒佳冬暖之夏冷亦得助正氣排邪又不得多多則昏醉昏醉則傷神損壽若遇尊貴事不得巳則須且飲但可呵三五下盞飲併則開口呵十數下遣麴之毒調理之常時飲二三升是日乃可一斗不至於醉亦不中酒亦不先食味亦不退如故調護訣調護訣曰凡修鍊服氣休絶之法不居産房不升喪堂六畜死穢一切雜穢不淨中驢馬惡氣之物並不冝聞況近之乎如見不祥臭穢即須念解穢咒不然甚損正氣不意卒然逢遇巳上之穢則速閉氣自取上風疾過則解之兼兩杯酒以蕩滌之佳如惡氣入覺不安穩即須調氣逐去勿留又恐有逆氣勿使出則却咽下更納氣以逆之當定以手摩助之便含椒及飲一兩杯酒令散矣如不散亦不使和平也斯必乃食油膩雜犯觸正氣用意有省當知向前所犯必是憂恚房事者勿再有誤也所服氣一年氣通二年氣行三年功成元氣遂凝結玄珠於丹田縱有犯觸無能為患日服千咽亦不懼多即返老還童轉從此也於是氣化為血血化為精精化為髓一年易氣二年易血三年易脈四年易肉五年易髓六年易筋七年易骨八年易髮九年易形十年之內三萬六千神備在身中當化為仙真號曰神人勤修至道鍊氣為形形化為神神形一體白日上升大道靈驗好仙君子詳而學焉勤修不怠即性開通五臟相固黃庭經云千千百百自相連一一十十似重山是也內氣不出外氣不入寒暑不侵兵刃莫害升騰變化夀同三光無窮盡也休糧訣休糧訣曰凡欲休糧但依前勤修三年之後正氣流通體實骨滿百神守位三尸遁逃如此轉不欲聞五味之氣常思不食須絶則絶亦復無難但覺腹空即須咽氣不問早晚何論約限久久自和節度時候無煩具言亦可兼藥物大有服藥之人多不服氣區區終身唯以藥物為務固未得亦非上士用心也黃庭經云百穀之實上地精五味外美邪魔腥臭亂神明胎氣零那從反老得還嬰何不食氣太和精故能不死入黃寧愼真訣愼真訣曰世上之人率多嗜欲損生伐命今古共然不早備防悔將何及仙經曰夫人臨終而始惜身罪定而思遷善病成而方求其藥天真巳散何可追之故賢哲上士惜未危之命懼未禍之禍治未病之病遂拂衣塵寰攝心歸道道者氣也身之主者精精者命之根愛精重氣然可庶幾乎長生矣黃庭經曰方寸之中念深臟三神還歸老方壯又曰長生至愼房中急何為死作令神泣忽之禍鄉三靈沒但當吸氣録子精寸田尺宅可治生若當決海百瀆傾葉去樹枯失青青此禁養精神之術凡學長生久視未有不愛精保氣而致也陰丹百御之道人莫不知雖務於氣而不絶欲亦不免危殆故曰人常失道非道夫人人常去道非道去人修養君子深冝自省也夫氣者道也道者虛無也虛無者自然也自然者無為也無為者心不動也心不動者謂內心不起內心不起即外境不入內外安靜即神妍神妍即氣和氣和即元氣目至元氣自至即五臟滋潤五臟滋潤即百脈流通百脈流通即津液上應津液上應即不須五味五味止絶飢渴不生飢渴不生三田成體堅骨實肉返老還年漸從此矣故其氣化為血血化為精精化為髓一年易氣二年易血三年易脈四年易肉五年易髓六年易筋七年易骨八年易髮九年易形三萬六千神住在身化為仙人是心體玄微理生不測也五臟和津液生三膲通氣不壅此謂瓊丹非世間丹也夫神者無形之至靈故神稟於道靜而合乎性人稟於神動而合乎情故率性則神凝久則神止擾則神遷止則生遷則死皆情之所移非神之所使也夫欲服氣先須靜坐一覺向上想過欲界色界無色界更過太始太素太初太極太髙想元氣下從頂門入念至涌泉端坐記入息莫記出息但用一覺使元氣隨意而到三丹田轉輪如流水王老經云元氣流通不死之道至人可知也蚩蚩者不足與議愼之又曰胎息守中上與天連名大道行之立得飛仙祕之愼之保之嵩山太無先生氣經卷上
